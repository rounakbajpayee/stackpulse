name: CI Build & Test

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript & Vite Production Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: 'https://huubxklntrxcwqkoumhd.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'sb_publishable_TDCRrXlv30o9LjLM_uofjg_WhJDQ_si'
